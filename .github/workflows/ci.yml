name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x86 (.NET Framework 4.8)
    runs-on: windows-2022
    env:
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install front-end dependencies
        working-directory: web
        run: npm ci

      - name: Type-check front-end
        working-directory: web
        run: npx tsc --noEmit

      - name: Build front-end
        working-directory: web
        run: npm run build

      - name: Build application (in-process Roslyn, no Visual Studio needed)
        shell: cmd
        run: build.bat

      - name: Verify output
        shell: pwsh
        run: |
          if (-not (Test-Path beta/MemberManager.exe)) { throw "beta/MemberManager.exe was not produced" }
          if (-not (Test-Path beta/web/index.html)) { throw "beta/web was not copied" }
          Get-ChildItem beta | Select-Object Name, Length | Format-Table -AutoSize
          (Get-FileHash beta/MemberManager.exe -Algorithm SHA256).Hash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MemberManager-beta
          path: beta/
          if-no-files-found: error
          retention-days: 7
